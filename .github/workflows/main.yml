name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Tizim paketlari
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool libltdl-dev \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev build-essential ccache

      - name: Python paketlari
        run: |
          python -m pip install --upgrade pip "setuptools<70" wheel
          pip install "cython==0.29.36" "buildozer==1.5.0" virtualenv

      - name: APK yig'ish
        run: yes | buildozer -v android debug

      - name: APK ni yuklash
        uses: actions/upload-artifact@v4
        with:
          name: AutoCallKeygen-apk
          path: bin/*.apk

      - name: Xato bo'lsa logni yuklash
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: .buildozer/logs/
          if-no-files-found: ignore
